<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ground / viewport grid -->
  <g stroke="#A19D17" stroke-width="1" opacity="0.16">
    <line x1="400" y1="380" x2="50" y2="480"/>
    <line x1="400" y1="380" x2="150" y2="480"/>
    <line x1="400" y1="380" x2="250" y2="480"/>
    <line x1="400" y1="380" x2="350" y2="480"/>
    <line x1="400" y1="380" x2="450" y2="480"/>
    <line x1="400" y1="380" x2="550" y2="480"/>
    <line x1="400" y1="380" x2="650" y2="480"/>
    <line x1="400" y1="380" x2="750" y2="480"/>
    <line x1="0" y1="404" x2="800" y2="404"/>
    <line x1="0" y1="430" x2="800" y2="430"/>
    <line x1="0" y1="458" x2="800" y2="458"/>
  </g>

  <!-- translucent facets for depth -->
  <g fill="#A19D17">
    <polygon points="400,85 542.7,123 488.2,184.5" opacity="0.10"/>
    <polygon points="400,85 257.3,123 311.8,184.5" opacity="0.06"/>
    <polygon points="488.2,184.5 488.2,215.5 400,315" opacity="0.08"/>
    <polygon points="311.8,184.5 311.8,215.5 400,315" opacity="0.05"/>
    <polygon points="400,40 542.7,123 400,85" opacity="0.12"/>
  </g>

  <!-- wireframe mesh: low-poly gem (icosahedron projection) -->
  <g stroke="#A19D17" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
    <!-- apex to upper ring -->
    <line x1="400" y1="40" x2="400" y2="85"/>
    <line x1="400" y1="40" x2="542.7" y2="123"/>
    <line x1="400" y1="40" x2="488.2" y2="184.5"/>
    <line x1="400" y1="40" x2="311.8" y2="184.5"/>
    <line x1="400" y1="40" x2="257.3" y2="123"/>

    <!-- upper ring -->
    <line x1="400" y1="85" x2="542.7" y2="123"/>
    <line x1="542.7" y1="123" x2="488.2" y2="184.5"/>
    <line x1="488.2" y1="184.5" x2="311.8" y2="184.5"/>
    <line x1="311.8" y1="184.5" x2="257.3" y2="123"/>
    <line x1="257.3" y1="123" x2="400" y2="85"/>

    <!-- cross edges -->
    <line x1="400" y1="85" x2="488.2" y2="215.5"/>
    <line x1="542.7" y1="123" x2="488.2" y2="215.5"/>
    <line x1="542.7" y1="123" x2="542.7" y2="277"/>
    <line x1="488.2" y1="184.5" x2="542.7" y2="277"/>
    <line x1="488.2" y1="184.5" x2="400" y2="315"/>
    <line x1="311.8" y1="184.5" x2="400" y2="315"/>
    <line x1="311.8" y1="184.5" x2="257.3" y2="277"/>
    <line x1="257.3" y1="123" x2="257.3" y2="277"/>
    <line x1="257.3" y1="123" x2="311.8" y2="215.5"/>
    <line x1="400" y1="85" x2="311.8" y2="215.5"/>

    <!-- lower ring -->
    <line x1="488.2" y1="215.5" x2="542.7" y2="277"/>
    <line x1="542.7" y1="277" x2="400" y2="315"/>
    <line x1="400" y1="315" x2="257.3" y2="277"/>
    <line x1="257.3" y1="277" x2="311.8" y2="215.5"/>
    <line x1="311.8" y1="215.5" x2="488.2" y2="215.5"/>

    <!-- lower ring to base -->
    <line x1="400" y1="360" x2="488.2" y2="215.5"/>
    <line x1="400" y1="360" x2="542.7" y2="277"/>
    <line x1="400" y1="360" x2="400" y2="315"/>
    <line x1="400" y1="360" x2="257.3" y2="277"/>
    <line x1="400" y1="360" x2="311.8" y2="215.5"/>
  </g>

  <!-- vertices -->
  <g fill="#A19D17">
    <circle cx="400" cy="40" r="3"/>
    <circle cx="400" cy="360" r="3"/>
    <circle cx="400" cy="85" r="2.5"/>
    <circle cx="542.7" cy="123" r="2.5"/>
    <circle cx="488.2" cy="184.5" r="2.5"/>
    <circle cx="311.8" cy="184.5" r="2.5"/>
    <circle cx="257.3" cy="123" r="2.5"/>
    <circle cx="488.2" cy="215.5" r="2.5"/>
    <circle cx="542.7" cy="277" r="2.5"/>
    <circle cx="400" cy="315" r="2.5"/>
    <circle cx="257.3" cy="277" r="2.5"/>
    <circle cx="311.8" cy="215.5" r="2.5"/>
  </g>
</svg>
